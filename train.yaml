# Paths
data_path: dataset/imagenet/train
# Only student/teacher model weights are loaded; training state starts fresh.
initial_checkpoint: checkpoints/ibot_vit_small.pth
output_dir: output

# Model
arch: vit_small

# Loss and teacher
lambda1: 1.0  # Global CLS loss
lambda2: 1.0  # Masked patch loss
lambda3: 1.0  # Intersection-region loss
# Minimum two-view intersection as a fraction of the original image area.
region_min_area: 0.05
momentum_teacher: 0.996
teacher_temp: 0.07
teacher_patch_temp: 0.07

# Training
# Number of epochs in the new run. Schedules start from epoch 0.
epochs: 50
gpu_count: 4
batch_size_per_gpu: 64
seed: 0
use_fp16: true

# Optimizer and schedules
optimizer: adamw
lr_schedule: cosine
warmup_epochs: 0
weight_decay: 0.04

# Data loading
num_workers: 10

# Weights & Biases
wandb_project: ibot-imagenet1k
wandb_entity: null
wandb_run_name: null
