# Paths
data_path: dataset/imagenet/train
# Must be an official full checkpoint with student, teacher, heads, and centers.
initial_checkpoint: checkpoints/ibot_vit_small.pth
# Every launch creates a run-specific subdirectory below this root.
output_dir: output/region_loss

# Model
arch: vit_small

# Loss and teacher
lambda1: 1.0  # Global CLS loss
lambda2: 1.0  # Masked patch loss
lambda3: 0.1  # Final intersection-region loss weight
region_warmup_epochs: 5  # Linear ramp from zero to lambda3
# Minimum two-view intersection as a fraction of the original image area.
region_min_area: 0.10
momentum_teacher: 0.9995
teacher_temp: 0.07
teacher_patch_temp: 0.07

# Training
# Number of epochs in the new run. Schedules start from epoch 0.
epochs: 50
gpu_count: 4
batch_size_per_gpu: 64
seed: 0
use_fp16: true

# Optimizer and schedules
optimizer: adamw
lr_schedule: cosine
lr: 0.0001
min_lr: 0.000001
warmup_epochs: 5
weight_decay: 0.04

# Data loading
num_workers: 10

# Weights & Biases
wandb_project: ibot-imagenet1k
wandb_entity: null
wandb_run_name: null
